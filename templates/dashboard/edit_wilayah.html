{% extends 'base.html' %}

{% block title %}Edit Wilayah - BPS Monitoring{% endblock %}
{% block page_title %}Edit Master Wilayah{% endblock %}

{% block content %}
<div class="card col-md-6 shadow-sm">
    <div class="card-header bg-warning text-dark py-3">
        <h6 class="mb-0 fw-bold"><i class="fas fa-edit me-2"></i>Form Perubahan Data Wilayah</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Kode Wilayah Resmi (BPS)</label>
                <input type="text" name="kode_wilayah" class="form-control" value="{{ wilayah.kode }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Nama Kecamatan</label>
                <input type="text" name="nama_kecamatan" class="form-control" value="{{ wilayah.nama_kecamatan }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Nama Kelurahan / Desa</label>
                <input type="text" name="nama_kelurahan" class="form-control" value="{{ wilayah.nama_kelurahan }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Target Muatan Usaha Sensus</label>
                <input type="number" name="target_usaha" class="form-control" value="{{ wilayah.target_usaha }}" min="0" required>
            </div>

            <div class="d-flex justify-content-between pt-2">
                <a href="{% url 'daftar_wilayah' %}" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-warning fw-bold text-dark">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
